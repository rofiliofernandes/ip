name = "impression-photography"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "impression-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "impression-media"

[vars]
SITE_NAME = "Impression Photography"
PHONE = "8087467783"
MAPS_URL = "https://maps.google.com/?cid=17848990732573835237&entry=gps"
ADMIN_HOST = ""
