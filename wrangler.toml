name = "ip"
main = "src/worker.ts"
compatibility_date = "2026-09-05"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "impression-db"
database_id = "526c9f75-5ef1-4df7-8bd2-38ca67fbc6e5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "impression-media"


[vars]
SITE_NAME = "Impression Photography"
PHONE = "8087467783"
MAPS_URL = "https://maps.google.com/?cid=17848990732573835237&entry=gps"
ADMIN_HOST = "admin.impressionphotographygoa.com"
GOOGLE_PLACE_ID = "ChIJmeK4XLzBvzsR5X9N1oBatPc"
INSTAGRAM_APP_ID = "2514565005727841"
INSTAGRAM_REDIRECT_URI = "https://admin.impressionphotographygoa.com/api/instagram/callback"
INSTAGRAM_GRAPH_VERSION = "v24.0"
ADMIN_OWNER_EMAIL = "rofitest8@gmail.com"
